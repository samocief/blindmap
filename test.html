<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Slepá mapa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap">
<link rel="stylesheet" href="css/app.css?v=2.17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c4f8a'/%3E%3Cpath d='M7 22l6-12 5 8 3-4 4 8z' fill='%23f5f7ea'/%3E%3Ccircle cx='21' cy='9' r='3' fill='%23ff74b4'/%3E%3C/svg%3E">
</head>
<body>
<main>
  <div class="wrap" id="p-wrap">
    <section id="p-load" data-screen="p"><p class="muted"><span class="spin"></span><span id="p-load-msg" data-i18n="common.loading">Načítavam…</span></p></section>

    <section id="p-fail" data-screen="p" hidden>
      <h1 data-i18n="app.title">Slepá mapa</h1>
      <p id="p-fail-msg" class="alert"></p>
      <p id="p-fail-practice" hidden><a class="button primary big" href="./" data-i18n="p.practice"></a></p>
    </section>

    <section id="p-wait" data-screen="p" hidden>
      <h1 data-i18n="p.wait_title"></h1>
      <p class="muted" id="p-wait-sub"></p>
      <p class="note"><span class="spin"></span><span data-i18n="p.wait_text"></span></p>
    </section>

    <section id="p-pick" data-screen="p" hidden>
      <h1 id="p-pick-title" data-i18n="p.who">Kto si?</h1>
      <p class="muted" id="p-pick-cls"></p>
      <p id="p-pick-err" class="alert" hidden></p>
      <div id="p-names" class="names"></div>
      <form id="p-ext" class="panel" hidden>
        <label for="p-ext-name"><span data-i18n="p.name_label"></span><input id="p-ext-name" maxlength="40" autocomplete="name" autocapitalize="words" data-i18n-attr="placeholder:p.name_ph"></label>
        <div><button class="primary big" type="submit" data-i18n="p.name_go"></button></div>
      </form>
    </section>

    <section id="p-confirm" data-screen="p" hidden>
      <h1 id="p-confirm-name"></h1>
      <div class="panel">
        <p data-i18n="p.confirm_text"></p>
        <div class="row">
          <button class="primary big" id="p-confirm-go" type="button" data-i18n="p.confirm_yes"></button>
          <button id="p-confirm-back" type="button" data-i18n="p.confirm_back"></button>
        </div>
      </div>
    </section>

    <section id="p-intro" data-screen="p" hidden>
      <div>
        <h1 id="p-intro-hello"></h1>
        <p class="muted" id="p-intro-group" hidden></p>
      </div>
      <div class="panel">
        <p id="p-intro-n"></p>
        <ul class="rules">
          <li data-i18n="p.rule_free"></li>
          <li data-i18n="p.rule_pin"></li>
          <li data-i18n="p.rule_flag"></li>
          <li data-i18n="p.rule_meters"></li>
          <li data-i18n="p.rule_zoom"></li>
          <li data-i18n="p.rule_score"></li>
          <li id="p-intro-landscape" data-i18n="p.rule_landscape" hidden></li>
          <li id="p-intro-wake"></li>
        </ul>
        <p class="alert" id="p-intro-leave"></p>
        <p class="alert" id="p-intro-err" hidden></p>
        <div><button class="primary big" id="p-intro-go" type="button" disabled></button></div>
      </div>
    </section>

    <section id="p-left" data-screen="p" hidden>
      <h1 data-i18n="p.left_title"></h1>
      <div class="panel">
        <p class="alert" id="p-left-msg"></p>
        <div><button class="primary big" id="p-left-go" type="button" data-i18n="p.left_go"></button></div>
      </div>
    </section>

    <section id="p-submit" data-screen="p" hidden>
      <h1 data-i18n="p.submit_title"></h1>
      <div class="panel">
        <p><b id="s-sum"></b> <span class="muted" data-i18n="p.submit_time"></span> <b id="s-time"></b></p>
        <div id="s-miss-row" class="stack tight"><span data-i18n="p.submit_miss"></span><div class="qnav multi" id="s-miss"></div></div>
        <div id="s-marked-row" class="stack tight"><span data-i18n="p.submit_marked"></span><div class="qnav multi" id="s-marked"></div></div>
        <p class="small muted" data-i18n="p.submit_note"></p>
        <div class="row">
          <button class="primary big" id="s-go" type="button" data-i18n="p.submit"></button>
          <button id="s-back" type="button" data-i18n="p.submit_back"></button>
        </div>
      </div>
    </section>

    <section id="p-end" data-screen="p" hidden>
      <h1 id="p-end-title"></h1>
      <p id="p-end-ended" class="alert" hidden data-i18n="p.ended"></p>
      <p id="p-end-time" class="note" hidden data-i18n="p.time_up"></p>
      <div class="panel">
        <p id="p-end-n"></p>
        <p id="p-end-status" class="muted"></p>
        <div><button id="p-end-retry" type="button" hidden data-i18n="p.retry"></button></div>
      </div>
      <p class="note" id="p-end-wait" hidden><span class="spin"></span><span data-i18n="p.wait_results"></span></p>
    </section>

    <section id="p-results" data-screen="p" class="results" hidden>
      <div class="task">
        <div><div class="kind" id="r-sub"></div><h1 id="r-title"></h1></div>
        <div class="bigpct" id="r-pct"></div>
      </div>
      <p class="small muted" id="r-penalty" hidden></p>
      <div class="mapbox" id="r-mapbox"><svg id="r-map" class="map pan" role="img"></svg></div>
      <div class="legend small muted">
        <span><span class="dot" style="background:var(--tip)"></span><span data-i18n="map.legend_tip"></span></span>
        <span><span class="dot" style="background:var(--ok)"></span><span data-i18n="map.legend_ok"></span></span>
        <span data-i18n="p.tap_item"></span>
      </div>
      <ol class="reslist" id="r-list"></ol>
      <div class="row"><button id="r-img" type="button" data-i18n="p.download_img"></button><p id="r-img-status" class="small muted" hidden></p></div>
    </section>

    <footer class="foot2 copy">© samocief</footer>
  </div>

  <section id="p-game" data-screen="p" class="game exam" hidden>
    <div class="hud">
      <div class="task">
        <div class="name" id="g-name"></div>
        <div class="count"><b id="g-i"></b> / <span id="g-n"></span></div>
        <button class="mini quit" id="g-submit" type="button" data-i18n-attr="title:p.submit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-i18n="p.submit_short"></span></button>
      </div>
      <div class="meters">
        <div class="meter" id="m-time" data-i18n-attr="title:p.meter_time"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M10 3h4M12 3v2.5M18.5 6.5l1.5-1.5"/></svg><b id="m-time-v"></b><div class="bar"><i></i></div></div>
        <div class="meter" id="m-tips" data-i18n-attr="title:p.meter_tips"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M8 12.3l2.8 2.8L16.3 9"/></svg><b id="m-tips-v"></b><div class="bar"><i></i></div></div>
      </div>
      <nav class="qnav" id="g-nav" data-i18n-attr="aria-label:p.nav"></nav>
    </div>
    <div class="mapbox" id="g-mapbox"><svg id="g-map" class="map" role="img"></svg></div>
    <div class="foot">
      <div class="verdict" id="g-msg"></div>
      <button class="icon flag" id="g-flag" type="button" aria-pressed="false" data-i18n-attr="title:p.flag; aria-label:p.flag"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4"/><path d="M6 4h11l-2.5 4L17 12H6"/></svg></button>
      <button class="icon" id="g-prev" type="button" data-i18n-attr="title:p.prev; aria-label:p.prev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="primary big" id="g-btn" type="button"></button>
    </div>
  </section>
</main>
<div id="p-blur" class="cover" hidden><p class="alert" data-i18n="p.blur"></p></div>
<div id="p-small" class="cover" style="cursor:default" hidden><p class="alert" data-i18n="p.small"></p></div>

<script src="js/geo.js?v=2.17"></script>
<script src="js/core.js?v=2.17"></script>
<script src="js/data.js?v=2.17"></script>
<script src="js/map.js?v=2.17"></script>
<script src="js/pupil.js?v=2.17"></script>
</body>
</html>
