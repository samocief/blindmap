<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
// Odkaz na test žiaka (?s=<skript učiteľa>&t=<test>) patrí stránke test.html. Precvičovanie má v s len počet sekúnd.
(function () { var q = new URLSearchParams(location.search), s = q.get('s') || ''; if (q.get('t') && s && !/^\d+$/.test(s)) location.replace('test.html' + location.search + location.hash); })();
</script>
<title>Slepá mapa · precvičovanie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap">
<link rel="stylesheet" href="css/app.css?v=2.6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c4f8a'/%3E%3Cpath d='M7 22l6-12 5 8 3-4 4 8z' fill='%23f5f7ea'/%3E%3Ccircle cx='21' cy='9' r='3' fill='%23ff74b4'/%3E%3C/svg%3E">
</head>
<body>
<main>
  <div class="wrap" id="c-wrap">
    <section id="c-load" data-screen="c"><p class="muted"><span class="spin"></span><span id="c-load-msg" data-i18n="common.loading">Načítavam…</span></p></section>

    <section id="c-fail" data-screen="c" hidden>
      <h1 data-i18n="c.title"></h1>
      <p id="c-fail-msg" class="alert"></p>
    </section>

    <section id="c-setup" data-screen="c" hidden>
      <div>
        <h1 data-i18n="c.title"></h1>
        <p class="muted" data-i18n="c.intro"></p>
        <p class="small muted" id="c-privacy" data-i18n="c.privacy" hidden></p>
      </div>
      <div class="panel">
        <div class="row"><label for="c-region"><span data-i18n="t.regions"></span><select id="c-region"></select></label></div>
        <fieldset><legend data-i18n="t.types"></legend><div id="c-types" class="chips"></div></fieldset>
        <fieldset><legend data-i18n="t.on_map"></legend><div id="c-base" class="chips"></div></fieldset>
        <div class="row">
          <label for="c-dmin"><span data-i18n="t.diff_from"></span><select id="c-dmin"></select></label>
          <label for="c-dmax"><span data-i18n="t.diff_to"></span><select id="c-dmax"></select></label>
          <label for="c-n"><span data-i18n="t.count"></span><input id="c-n" type="number" min="1" max="50" inputmode="numeric"></label>
          <label for="c-time"><span data-i18n="c.time"></span><select id="c-time"></select></label>
        </div>
        <p id="c-pool" class="small muted"></p>
        <div><button class="primary big" id="c-go" type="button" data-i18n="p.start" disabled></button></div>
      </div>
    </section>

    <section id="c-end" data-screen="c" class="results" hidden>
      <div class="task">
        <div><div class="kind" id="c-end-sub"></div><h1 data-i18n="c.end_title"></h1></div>
        <div class="bigpct" id="c-end-pct"></div>
      </div>
      <div class="row">
        <button class="primary" id="c-again" type="button" data-i18n="c.again"></button>
        <button id="c-wrong" type="button"></button>
        <button id="c-settings" type="button" data-i18n="c.settings"></button>
      </div>
      <div class="mapbox" id="r-mapbox"><svg id="r-map" class="map pan" role="img"></svg></div>
      <div class="legend small muted">
        <span><span class="dot" style="background:var(--tip)"></span><span data-i18n="map.legend_tip"></span></span>
        <span><span class="dot" style="background:var(--ok)"></span><span data-i18n="map.legend_ok"></span></span>
        <span data-i18n="p.tap_item"></span>
      </div>
      <ol class="reslist" id="r-list"></ol>
    </section>
  </div>

  <section id="c-game" data-screen="c" class="game" hidden>
    <div class="hud">
      <div class="task">
        <div class="name" id="g-name"></div>
        <div class="count"><b id="g-i"></b> / <span id="g-n"></span><br><span id="g-sec"></span></div>
      </div>
      <div class="bar" id="g-bar"><i></i></div>
    </div>
    <div class="mapbox" id="g-mapbox"><svg id="g-map" class="map" role="img"></svg></div>
    <div class="foot">
      <div class="verdict" id="g-msg"></div>
      <button class="primary big" id="g-btn" type="button" disabled></button>
    </div>
  </section>
</main>

<script src="js/geo.js?v=2.6"></script>
<script src="js/core.js?v=2.6"></script>
<script src="js/data.js?v=2.6"></script>
<script src="js/map.js?v=2.6"></script>
<script src="js/practice.js?v=2.6"></script>
</body>
</html>
